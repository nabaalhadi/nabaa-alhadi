<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نبع الهادي - النقل والسفر</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6fb;
    }

    header {
      background: #1e40af;
      color: white;
      text-align: center;
      padding: 20px;
    }

    header h1 {
      margin: 0;
    }

    .hero {
      text-align: center;
      padding: 30px;
      background: white;
    }

    .btn {
      background: #1e40af;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .vehicles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
      height: 140px;
      object-fit: cover;
    }

    .form {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 10px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    footer {
      background: #1e40af;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>نبع الهادي</h1>
  <p>شركة نقل وسفر رسمية</p>
</header>

<div class="hero">
  <h2>نقل آمن وراقي بين المحافظات</h2>
  <p>حجز سريع، سيارات حديثة، وخدمة VIP</p>
  <a class="btn" href="https://wa.me/9647703120871" target="_blank">واتساب مباشر</a>
</div>

<section class="vehicles">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1619767886558-efdc259cde1a"/>
    <p>تويوتا هايس 2025</p>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2"/>
    <p>كيا كرنفال 2026</p>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1603386329225-868f9b1ee6a0"/>
    <p>جمسي يوكن 2026</p>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1542362567-b07e54358753"/>
    <p>تويوتا كوستر 2025</p>
  </div>
</section>

<section class="form">
  <h2>📍 نظام الحجز</h2>

  <input id="name" placeholder="الاسم"/>
  <input id="phone" placeholder="الهاتف"/>
  <input id="from" placeholder="من أين"/>
  <input id="to" placeholder="إلى أين"/>
  <input id="people" placeholder="عدد الأشخاص"/>
  <input id="date" type="date"/>
  <textarea id="details" placeholder="تفاصيل إضافية"></textarea>

  <button class="btn" onclick="sendBooking()">إرسال الحجز</button>
</section>

<footer>
  © 2026 نبع الهادي - جميع الحقوق محفوظة
</footer>

<script>
function sendBooking() {
  const phone = "9647703120871";

  const msg =
`🚌 حجز جديد نبع الهادي:

👤 الاسم: ${document.getElementById('name').value}
📞 الهاتف: ${document.getElementById('phone').value}
📍 من: ${document.getElementById('from').value}
📍 إلى: ${document.getElementById('to').value}
👥 الأشخاص: ${document.getElementById('people').value}
📅 التاريخ: ${document.getElementById('date').value}
📝 التفاصيل: ${document.getElementById('details').value}`;

  window.open(`https://wa.me/${phone}?text=` + encodeURIComponent(msg), "_blank");
}
</script>

</body>
</html>
