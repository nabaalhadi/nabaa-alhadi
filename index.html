<script>
function send(e){
  e.preventDefault();
  const f = e.target;

  const msg =
`🚍 حجز:
من: ${f.from.value}
إلى: ${f.to.value}
أشخاص: ${f.people.value}
سيارة: ${f.car.value}

  window.open("https://wa.me/9647891501942?text="+encodeURIComponent(msg));
}
