<!-- التواصل -->
<section class="section">
  <h2>📞 التواصل</h2>

<!-- الحجز -->
<section class="section">
  <h2>🚍 نظام الحجز</h2>

  <form onsubmit="sendWhatsApp(event)">

    <input name="from" placeholder="الانطلاق" required>
    <input name="to" placeholder="الوصول" required>
    <input name="people" placeholder="عدد الأشخاص" required>
    <input name="car" placeholder="نوع السيارة" required>
    <input name="days" placeholder="عدد الأيام (مبيت)" required>

    <button type="submit">إرسال الحجز عبر واتساب</button>

  </form>
</section>

<!-- السيارات -->
<section class="section">
  <h2>🚗 أسطول السيارات</h2>

  <div class="cars">

<!-- واتساب سكربت -->
<script>
function sendWhatsApp(e){
  e.preventDefault();

  const f = e.target;

  const msg =
`🚍 حجز جديد:
📍 الانطلاق: ${f.from.value}
📍 الوصول: ${f.to.value}
👥 الأشخاص: ${f.people.value}
🚗 السيارة: ${f.car.value}
🛏 الأيام: ${f.days.value}`;

  window.open(
    "https://wa.me/9647891501942?text=" + encodeURIComponent(msg),
    "_blank"
  );
}
</script>
